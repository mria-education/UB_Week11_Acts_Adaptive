romise — the poets are <strong>unwitting witnesses</strong> to a reality they perceived partially. Paul uses their partial vision as a ramp toward fuller disclosure.</p>\n<p><strong>Move 3: The Delayed Offense (17:30–31)</strong> — Only now does Paul introduce divine judgment and bodily resurrection — the two elements that would have caused immediate rejection if introduced at the opening. The audience&#x27;s reaction at &quot;resurrection&quot; (17:32) confirms that Paul delayed correctly.</p>\n<p>Brown&#x27;s contribution to reading this speech is his observation that the Areopagus address represents <strong>Luke&#x27;s model of missionary theology in a pluralistic context</strong>: the Gospel does not arrive as foreign imposition but as the fulfillment of what the host culture was already, imperfectly, seeking. The Unknown God was always the God of Jesus Christ. The poets were speaking better than they knew. This is not capitulation to Hellenism — it is the claim that all human seeking is, at its depth, a seeking for the one who has now been made known.</p>\n<p>---</p>"}, {"title": "PART SIX: PAUL IN ACTS AND PAUL IN THE LETTERS — Brown's Critical Problem", "html": "<h3>PART SIX: PAUL IN ACTS AND PAUL IN THE LETTERS — Brown&#x27;s Critical Problem</h3>\n<h3>6.1 The Historical-Critical Problem Brown Frames</h3>\n<p>One of Raymond Brown&#x27;s most significant and generative contributions to Acts scholarship is his sustained treatment of <strong>the relationship between the Paul of Acts and the Paul of the Epistles</strong> — a methodological issue that any graduate-level engagement with Acts must confront honestly.</p>\n<p>Brown&#x27;s fundamental observation is disarmingly simple but hermeneutically consequential: <strong>Luke appears not to have known Paul&#x27;s letters.</strong> Acts never references them, never quotes them, and nowhere demonstrates awareness that Paul had an extensive literary correspondence with his churches. This is remarkable. Paul&#x27;s letters were almost certainly circulating within Pauline communities before Acts was written (mid-80s CE). A Pauline companion writing in the 80s would most likely have known them.</p>\n<p>Brown&#x27;s explanation: the author of Acts was not a close Pauline companion writing from direct memory, but a <strong>second-generation Pauline-circle figure</strong> who had access to oral tradition, travel itineraries, and perhaps some written sources about Paul&#x27;s mission — but not to the Pauline epistles. This creates the interpretive situation in which Acts and Paul&#x27;s letters function as <strong>two independent witnesses</strong> to the same events and person — a situation of immense historical value but also of significant interpretive complexity.</p>\n<p>---</p>\n<h3>6.2 The Jerusalem Conference and Galatians 2: Brown&#x27;s Three-Position Analysis</h3>\n<p>The most acute instance of the Acts-versus-Epistles problem is the relationship between <strong>Acts 15</strong> (the Jerusalem Conference) and <strong>Galatians 2:1–10</strong> (Paul&#x27;s account of a Jerusalem meeting). Brown presents three scholarly positions:</p>\n<p><strong>Position 1 — Acts 15 = Galatians 2 (Same Meeting)</strong></p>\n<p>Both texts describe the same Jerusalem meeting, at which the question of Gentile circumcision was resolved and the Gentile mission was authorized. The differences between the accounts are explicable by different perspectives (Luke&#x27;s third-person narrative vs. Paul&#x27;s first-person defense) and different rhetorical purposes (Luke narrating history vs. Paul defending his apostolic independence).</p>\n<p><em>Problem</em>: Acts 15 describes a public, formal Council attended by apostles and elders, issuing an Apostolic Decree. Galatians 2 describes a private meeting with James, Peter, and John. Paul explicitly says he went up &quot;in accordance with a revelation&quot; (Gal 2:2) — not in response to a dispute from Antioch as Acts 15:1–2 indicates.</p>\n<p><strong>Position 2 — Acts 11:27–30 = Galatians 2 (Earlier Meeting)</strong></p>\n<p>The meeting Paul describes in Galatians 2 corresponds not to Acts 15 but to an earlier Jerusalem visit — the famine relief visit of Acts 11:27–30. The Jerusalem Conference of Acts 15 would then be a <em>later</em> meeting of which Galatians says nothing, or which Paul had not yet experienced when writing Galatians.</p>\n<p><em>Problem</em>: This requires positing that Galatians was written before Acts 15 — an early date that many scholars resist — and that Paul simply omitted the Acts 15 Conference from his account, which seems odd given its relevance to his argument.</p>\n<p><strong>Position 3 — Acts 15 and Galatians 2 are Different Meetings</strong></p>\n<p>The meetings are distinct events. Paul&#x27;s Galatians 2 private consultation precedes the more public Acts 15 conference. Galatians was written between these two events — after the private consultation but before the Council issued its formal decree.</p>\n<p>Brown&#x27;s own assessment: <strong>the most historically plausible reading is a version of Position 1 or 3</strong>, with the discrepancies explicable by Luke&#x27;s theological reshaping of the tradition. Luke has formalized and publicized a meeting that Paul experienced as more private — giving it the character of an official Council both to validate its authority and to present the early church&#x27;s unity in the most favorable possible light.</p>\n<p>For our relational ontology, Brown&#x27;s analysis reveals something important about <strong>how Acts handles the Matrix Space of communal conflict</strong>: Luke does not suppress the Jerusalem dispute — he narrates it honestly (15:2, &quot;no small dissension&quot;). But he resolves it through a process that is formally unified, scripturally grounded, and pneumatologically authorized. The Council as Luke presents it is both <strong>a historical event and a theological model</strong> — which is precisely why its discrepancies with Galatians are not accidental distortions but purposive reframings. Luke is not lying about what happened. He is shaping the memory of what happened into the form that will most effectively form the communities that receive his text.</p>\n<p>---</p>\n<h3>6.3 Luke&#x27;s Portrait of Paul vs. the Epistolary Paul</h3>\n<p>Beyond the Conference question, Brown identifies a series of <strong>characterological discrepancies</strong> between Acts&#x27; Paul and the Paul of the letters:</p>\n<div class=\"table-scroll\"><table>\n<tr><th>Issue</th><th>Paul in Acts</th><th>Paul in Letters</th></tr>\n<tr><td>Circumcision of Timothy</td><td>Performs it (16:3)</td><td>Refuses it for Titus (Gal 2:3)</td></tr>\n<tr><td>Relationship to the Jerusalem church</td><td>Deferential; reports to leadership</td><td>Insists on independence (Gal 1:17–20)</td></tr>\n<tr><td>Torah observance</td><td>Takes Nazirite vows (21:23–26)</td><td>Declares himself free from the Law (1 Cor 9:20)</td></tr>\n<tr><td>Self-presentation</td><td>Emphasizes Jewish identity</td><td>Emphasizes cruciform weakness (1 Cor 2:1–5)</td></tr>\n<tr><td>Rhetorical persona</td><td>Formal, civic, adapted to audience</td><td>Admits to being &quot;unskilled in speaking&quot; (2 Cor 11:6)</td></tr>\n</table></div>\n<p>Brown&#x27;s interpretive frame for these discrepancies is neither harmonization nor dismissal: <strong>Acts and the letters represent two different theological portraits of Paul, both grounded in historical memory, both shaped by their authors&#x27; theological purposes.</strong></p>\n<p>Luke&#x27;s Paul is a <em>bridge figure</em> — simultaneously Jewish enough to be credible in the synagogue and Roman enough to be protected by citizenship; simultaneously apostolic enough to heal and raise the dead and irenic enough to defer to Jerusalem. This Paul serves Luke&#x27;s dual apologetic purpose: demonstrating that Christianity is the fulfillment of Judaism (not its rejection) <em>and</em> that it is politically compatible with Roman order (not its subversion).</p>\n<p>Paul&#x27;s own letters present a more conflicted, more polemical, more pneumatically raw figure — a man who &quot;received the sentence of death&quot; in himself (2 Cor 1:9), who was &quot;beaten, stoned, shipwrecked&quot; (2 Cor 11:25), who opposed Peter to his face (Gal 2:11). This is the Paul of the Matrix Space — formed in the Transitional Zone between Jewish covenantal identity and Gentile mission field, never fully resolving the tension, always bearing the cost of the crossing.</p>\n<p>The hermeneutical implication Brown draws — and which we must hold for careful formation — is that <strong>both portraits are theologically necessary</strong>. Luke&#x27;s Paul models missional adaptability and institutional loyalty; the Epistolary Paul models apostolic integrity and cruciform vulnerability. The church that reads only Acts gets a Paul too civic and too comfortable. The church that reads only the letters gets a Paul too embattled and too individual. Both witnesses together produce the <strong>full topology of Spirit-formed apostolic identity</strong>.</p>\n<p>Brown&#x27;s analysis at this point carries a deeper methodological implication that graduate students of Scripture must internalize: <strong>canonical plurality is not a problem to be solved but a richness to be inhabited.</strong> The two Pauls — Acts&#x27; bridge-builder and the Epistles&#x27; cruciform sufferer — do not contradict each other; they triangulate a reality too multi-dimensional for any single portrait to capture. Luke has given us the Paul that second-generation communities needed for institutional formation and civic engagement. Paul has given us the Paul that personal formation and theological rigor demand. The canonical decision to include both — without harmonizing them into a single Paul — is itself a formation decision: the church needs the tension between civic embodiment and prophetic vulnerability, between institutional continuity and cruciform disruption, to remain itself.</p>\n<p>This tension is precisely what our relational ontology names as the Transitional Space of apostolic identity: <strong>the apostle lives permanently in the Constitutive In-Between</strong> — between the Jewish heritage that formed him and the Gentile world into which he was sent, between the communal accountability of Jerusalem and the Spirit-directed freedom of frontier mission, between the Form of a servant and the Force of prophetic proclamation. Neither Luke&#x27;s Paul nor the Epistolary Paul has fully crossed out of this Transitional Space — and perhaps that is the point. The apostle who has resolved all the tensions has ceased to be a threshold figure. The apostle who inhabits the threshold faithfully, bearing its costs without premature resolution, is the one through whom the both/and new creation continues to press into the world.</p>\n<p>---</p>"}, {"title": "PART SEVEN: INTERTEXTUAL FRAMEWORK — *The Isaianic Reversal*", "html": "<h3>PART SEVEN: INTERTEXTUAL FRAMEWORK — <em>The Isaianic Reversal</em></h3>\n<h3>7.1 The Isaianic Backbone of Luke-Acts</h3>\n<p>The most important intertextual relationship in Luke-Acts is with the <strong>Book of Isaiah</strong> — specifically chapters 40–66 (Deutero-Isaiah and Trito-Isaiah).</p>\n<p>Luke&#x27;s entire two-volume project can be read as a sustained narration of the <strong>reversal of the Isaianic judgment</strong>. The judgment in question is Isaiah 6:9–10 — God&#x27;s commission to Isaiah to speak to a people who <em>will hear but not understand, see but not perceive</em> — their hearts fat, their ears heavy, their eyes closed. Acts opens with this Isaianic shadow hanging over the narrative: will Israel receive the proclamation of its own Messiah?</p>\n<p>But Luke-Acts is not merely the <em>repetition</em> of Isaiah 6. It is its <strong>structural reversal</strong>. The final word is Isaiah 40:3–5 (quoted in Luke 3:4–6): <em>&quot;Every valley shall be filled… and all flesh shall see the salvation of God.&quot;</em> <strong>All flesh</strong> — not just Israel. The Gentile inclusion is not a departure from Israel&#x27;s story. It is the fulfillment of Isaiah&#x27;s eschatological horizon.</p>\n<p>Brown&#x27;s contribution at this point is his identification of what he calls Luke&#x27;s <strong>&quot;universal salvation&quot; motif</strong> — the consistent Lukan insistence that the Gospel&#x27;s scope exceeds every boundary that human religiosity tends to impose upon it. Luke-Acts opens with Simeon&#x27;s <em>Nunc Dimittis</em> (&quot;a light for revelation to the Gentiles,&quot; Luke 2:32) and closes with Paul&#x27;s open proclamation in Rome (Acts 28:31). The arc from Jerusalem&#x27;s Temple to Rome&#x27;s center is the arc of Isaiah 40:3–5 made spatial and historical.</p>\n<p>---</p>\n<h3>7.2 Acts 26:18 and the Witness Motif of Isaiah 43</h3>\n<p>The intertextual knot that binds Acts&#x27; mission theology to Isaiah&#x27;s witness theology is Paul&#x27;s commissioning speech in Acts 26:16–18:</p>\n<blockquote><em>&quot;…to open their eyes, so that they may turn from darkness to light and from the power of Satan to God, that they may receive forgiveness of sins and a place among those who are sanctified by faith in me.&quot;</em></blockquote>\n<p>The phrase <em>&quot;to open their eyes&quot;</em> directly echoes Isaiah 42:6–7 (the Servant given &quot;to open the eyes that are blind&quot;) and Isaiah 43:8–10 (Israel called to be God&#x27;s <em>witnesses</em> — a people whose eyes have been opened to perceive what others cannot).</p>\n<p>Paul&#x27;s commission places him within the Isaianic Servant-Witness trajectory. His task is not merely to preach information about Jesus. It is to <strong>open eyes</strong> — to effect the cognitive-covenantal transformation that enables formerly blind people to see the resurrected Christ as the fulfillment of Israel&#x27;s entire covenantal history.</p>\n<p>Salvation in Luke-Acts, at its deepest structure, is a <strong>perceptual event</strong>: the one who was blind now sees. This is why Luke&#x27;s resurrection narratives turn on recognition — the disciples on the Emmaus road whose &quot;eyes were opened&quot; (Luke 24:31). Seeing the risen Christ is not merely visual — it is the restoration of full covenantal perception, the reversal of Isaiah 6&#x27;s judgment upon closed eyes.</p>\n<p>The Spirit&#x27;s work in Acts is, therefore, fundamentally <strong>illuminative</strong>: the Spirit opens the eyes of the spiritually blind to perceive the crucified and risen Jesus as Lord, and empowers them to <em>witness</em> — to testify from their own opened-eyed experience — to others still in darkness.</p>\n<p>---</p>"}, {"title": "PART SEVEN-B: THE ECONOMIC WITNESS OF ACTS — *Koinōnia as Kingdom Enactment*", "html": "<h3>PART SEVEN-B: THE ECONOMIC WITNESS OF ACTS — <em>Koinōnia as Kingdom Enactment</em></h3>\n<h3>7B.1 The Jubilee Baseline: Luke 4:18 as Structural Premise</h3>\n<p>The economic teaching of Acts cannot be read in isolation from the programmatic declaration that precedes it. In Luke 4:18–19, Jesus reads from Isaiah 61 in the Nazareth synagogue: <em>&quot;The Spirit of the Lord is upon me, because he has anointed me to bring good news to the poor.&quot;</em> This is not merely a thematic introduction — it is a structural claim about whose news this Gospel is and who its primary recipients are. Joel B. Green states the exegetical position with directness: <em>&quot;The &#x27;poor&#x27; in Luke-Acts are the materially destitute, not a spiritual category.&quot;</em> Contemporary communities that spiritualize Luke&#x27;s economic language have domesticated the Gospel&#x27;s most uncomfortable demand.</p>\n<p>Acts 2:44–45 and 4:32–35 are not the early community&#x27;s utopian experiment. They are the <strong>narrative fulfillment of the Jubilee proclamation</strong> — the Kingdom of God taking concrete economic form in the life of the Spirit-empowered community: <em>&quot;There was not a needy person among them&quot;</em> (4:34). This sentence is not a historical observation. In Luke&#x27;s narrative economy, it is the diagnostic criterion by which every subsequent community that reads this text is measured.</p>\n<p>---</p>\n<h3>7B.2 deSilva — Koinōnia as Social Architecture</h3>\n<p>David A. deSilva&#x27;s socio-rhetorical method illuminates the first-century context within which Acts&#x27; economic practice was genuinely revolutionary. Greco-Roman society was structured by entrenched hierarchies of patronage, benefaction, and honor-shame dynamics: the powerful extended benefits to clients, who reciprocated with public honor and political loyalty. Generosity was strategic, not kenotic — it circulated within existing power structures to reinforce them.</p>\n<p>The Jerusalem community&#x27;s <em>koinōnia</em> dismantled this architecture at its foundations. By liquidating private property voluntarily — not as a tax or a tithe but as a Spirit-generated restructuring of belonging — and by distributing &quot;to each as any had need&quot; (4:35), the early church enacted a social topology that the Greco-Roman world had no category for: <strong>belonging without hierarchy, generosity without reciprocity, community without patronage</strong>. The shared meal that erased socioeconomic stratification was not merely a religious ritual. It was a structural subversion of the Mediterranean world&#x27;s deepest social logic.</p>\n<p>---</p>\n<h3>7B.3 The Diagnostic Failure of Ananias and Sapphira (Acts 5:1–11)</h3>\n<p>The narrative immediately tests the Jerusalem community&#x27;s economic practice with its starkest counter-example. Ananias and Sapphira sell a piece of property, secretly retain a portion, and present the remainder as the full proceeds. Peter&#x27;s diagnosis is surgically precise: <em>&quot;You have not lied to human beings but to God&quot;</em> (5:4).</p>\n<p>This episode is not primarily about sudden death as divine punishment. It is about <strong>the specific form of structural betrayal that occurs when Kingdom economics is simulated rather than inhabited</strong>. The failure of Ananias and Sapphira is not that they kept money — Peter explicitly acknowledges their freedom to keep it (5:4). The failure is the <em>performance</em> of full economic belonging while retaining self-protective reserve: the attempt to claim the social standing of the new community without bearing its full cost.</p>\n<p>In the framework of this manuscript, this is the economic form of KAIROS THEFT — the attempt to receive the benefits of crossing while foreclosing the actual crossing. The community&#x27;s integrity as a Matrix Space for formation requires that the economic practice be real, not performed. Simulation destroys the Matrix Space from within.</p>\n<p>---</p>\n<h3>7B.4 The Hellenist Crisis as Structural Justice Demand (Acts 6:1–7)</h3>\n<p>The internal conflict over the daily distribution of goods between Aramaic-speaking Hebrews and Greek-speaking Hellenists (Acts 6:1–7) is Acts&#x27; first formal structural justice crisis — and its resolution models something the church has rarely replicated.</p>\n<p>The Hellenist widows are being overlooked in the daily distribution: a systemic inequity, not a personal slight. The apostles&#x27; response is not to defend themselves, manage the optics, or defer the problem. They restructure. The Seven are appointed from the marginalized Hellenist community — those experiencing the inequity are given structural authority over its remedy. This is not charity management. It is <strong>power redistribution in response to institutional inequity</strong>.</p>\n<p>Brown&#x27;s observation is incisive here: the resolution of this structural justice crisis paradoxically generates the Hellenist leaders whose boundary-crossing will drive the mission outward — Philip to Samaria and the Ethiopian eunuch, Stephen to his martyrdom and the Gentile dispersal. The structural justice act <em>produces</em> the missional advance. Koinōnia is not merely the background condition of Acts&#x27; mission; it is, repeatedly, its generative engine.</p>\n<blockquote><strong>Structural Diagnostic — Three Questions for Every Community Reading Acts 6:</strong></blockquote>\n<blockquote></blockquote>\n<blockquote><em>Who in your community is being structurally overlooked in the distribution of goods, voice, and access? Not by individual malice — but by systemic habit and demographic default?</em></blockquote>\n<blockquote></blockquote>\n<blockquote><em>Is the remedy administered by those holding current authority, or is structural authority redistributed to those experiencing the inequity?</em></blockquote>\n<blockquote></blockquote>\n<blockquote><em>What missional movement might be waiting on the other side of your community&#x27;s structural justice reckoning?</em></blockquote>\n<p>---</p>\n<h3>7B.5 The Permanent Challenge: Acts 2:44–45 as Reader Formation</h3>\n<p>Acts never releases the reader from the economic question. The narrative&#x27;s two summary passages — 2:42–47 and 4:32–35 — are positioned at the beginning of the community&#x27;s story, before any of the subsequent failures and controversies, as the normative vision against which everything that follows is measured. Their position is not nostalgic (&quot;this is what the early church managed for a brief time&quot;) but prescriptive (&quot;this is what the Spirit-empowered community characteristically produces&quot;).</p>\n<p>Brown ties salvation (<em>sōtēria</em>) to witness throughout Acts: the community&#x27;s life together — its economic sharing, its boundary-crossing, its Spirit-empowered proclamation — are all <em>dimensions of the salvation it announces and enacts.</em> The community that preaches liberation while practicing economic stratification has not misunderstood a single text. It has misunderstood the narrative&#x27;s structural logic: that the Spirit who opens the eyes of the blind also opens the hands of the possessive, and that a community where &quot;there was not a needy person among them&quot; is not the church&#x27;s sentimental ideal but its Spirit-formed diagnostic.</p>\n<blockquote><em>MIS — What would it mean for your student community, your campus fellowship, or your local church to take Luke&#x27;s economic teaching with full seriousness? What would need to change — not just individually but structurally — for &quot;there was not a needy person among them&quot; to be true of your community?</em></blockquote>\n<p>---</p>"}, {"title": "PART EIGHT: CONCLUSION — Unity, Diversity, and the Open Ending", "html": "<h3>PART EIGHT: CONCLUSION — Unity, Diversity, and the Open Ending</h3>\n<h3>8.1 The Jerusalem Council as Ecclesial Model (Acts 15)</h3>\n<p>We return, in conclusion, to the Jerusalem Council — not merely as a historical event, but as <strong>Acts&#x27; definitive model for ecclesial discernment under pressure</strong>.</p>\n<p>The crisis is irreducibly concrete: <em>&quot;Unless you are circumcised according to the custom of Moses, you cannot be saved&quot;</em> (15:1). This is a <strong>formation question</strong> — a WHERE-WHO-WHAT question about the nature of the community the Gospel is producing. Must the new household look like the old household? The Council&#x27;s process is itself the model:</p>\n<p>1. <strong>The conflict is not suppressed</strong> — &quot;no small dissension and debate&quot; (15:2). The tension is honored, not managed away.</p>\n<p>2. <strong>Multiple voices are heard</strong> — Peter&#x27;s experience, Paul and Barnabas&#x27;s testimony, and James&#x27;s scriptural discernment all contribute. No single authority resolves unilaterally.</p>\n<p>3. <strong>The resolution is grounded in threefold accountability</strong> — pneumatological experience, missional testimony, and canonical Scripture held together. James&#x27;s citation of Amos 9:11–12 demonstrates that the Gentile inclusion is the <em>intended eschatological outcome</em> of Israel&#x27;s own prophetic tradition.</p>\n<p>4. <strong>The outcome is a new structure, not a compromise</strong> — the Apostolic Decree creates a <strong>new relational topology</strong>: a minimal framework making shared table fellowship possible across the Jewish-Gentile boundary.</p>\n<p>Brown&#x27;s critical analysis of Acts 15 (which we treated in Part Six above) adds an essential layer: the Council&#x27;s portrait in Acts is both historically grounded and theologically shaped. Luke presents the early church&#x27;s diversity-navigation in its most unified and ordered form — precisely because his communities, writing in the 80s CE, need a <strong>foundational model</strong> for their own diversity management. The Council is not <em>merely</em> what happened in 48–49 CE. It is the normative template for how the Spirit-community navigates the both/and.</p>\n<blockquote><strong>▸ Diffraction→Kairos — The Jerusalem Council&#x27;s Generative Both/And</strong></blockquote>\n<blockquote></blockquote>\n<blockquote>The Council enacts the Diffraction→Kairos Integrated Thesis at its most institutionally visible. The conflict of Acts 15:1–2 is not a failure of community — it is the necessary friction of the diffractive aperture being prepared. Both positions — circumcision required / circumcision not required — are held simultaneously by the assembled community, neither prematurely resolved nor violently suppressed. This is Haraway&#x27;s <em>staying with the trouble</em> in its most ecclesially demanding form: the community must remain in the both/and long enough for something genuinely new to emerge through it. James&#x27;s citation of Amos 9:11–12 is the KAIROS address that passes through the aperture: not a proof-text imposed from outside the struggle, but the word that enters the prepared opening and produces — not a compromise ruling — but a <strong>genuinely new ecclesial topology</strong>: the household of God that is neither Jewish nor Gentile but a third thing that neither prior world had imagined. The Apostolic Decree is not a middle-ground settlement. It is Formation Permanence institutionalized: the new WHO locked in place by a structure that makes shared table possible without requiring either side to dissolve.</blockquote>\n<blockquote><strong>▸ Future Self Protocol — Jerusalem Council Community</strong> <em>(Tier 3 | Bloom 6 | ICAP: Interactive)</em></blockquote>\n<blockquote></blockquote>\n<blockquote><em>Individual Future Self</em>: For the Gentile believer at the Council&#x27;s threshold, the Future Self is one who belongs to Israel&#x27;s covenant God without requiring Israel&#x27;s ethnic-ritual formation history — a WHO that neither Second Temple Judaism nor Greco-Roman religion had previously imagined possible. Named from <em>within the crossing</em>, not at the destination: <em>not yet fully received in every community, still contested at the edges, bearing the cost of a belonging that must be continuously renegotiated across cultural boundaries</em> — but already permanently altered by the Spirit&#x27;s arrival before circumcision. Post-Birth Irreversibility: no subsequent Judaizing pressure can undo what the Spirit did at Cornelius&#x27;s house. The new WHO cannot be un-born. This is always an invitation, never a structural demand.</blockquote>\n<blockquote></blockquote>\n<blockquote><em>Communal Future Self</em>: The community emerging from Acts 15 is the first genuinely multi-ethnic, boundary-crossing household of God in recorded history — constituted not by shared ethnicity, shared law, or shared culture, but by shared reception of the Spirit and shared participation in the table of the Lord. Named from <em>within the crossing</em>: <em>still navigating the practical demands of the Apostolic Decree, still holding the tension of difference across every city Paul&#x27;s mission has touched, still absorbing the relational cost of the both/and</em> — but constituted by a KAIROS that neither Jew nor Gentile could have generated unilaterally. The communal Future Self is the church as Womb Topology: the Matrix Space that holds difference without dissolution and generates new creation from the crossing itself.</blockquote>\n<blockquote><strong>▸ 5C Competency Activation — Jerusalem Council (learning checkpoint | 5C Enforcement)</strong></blockquote>\n<blockquote></blockquote>\n<blockquote>- <strong>Critical</strong>: The Council models rigorous evaluation of competing theological claims held against pneumatological experience and canonical evidence simultaneously — neither dismissing the Judaizing position without hearing nor accepting it without scriptural grounding. Evidence is triaged by three criteria: testimony, experience, Scripture.</blockquote>\n<blockquote>- <strong>Creative</strong>: James&#x27;s Amos 9:11–12 citation is a creative hermeneutical act — reading an Israelite restoration text eschatologically to authorize a Gentile missional practice the original context did not anticipate. This is not exegetical convenience; it is Spirit-led creative interpretation that the both/and aperture has made possible.</blockquote>\n<blockquote>- <strong>Communication</strong>: The Apostolic Decree (15:28–29) is Acts&#x27; model of translating theological resolution into cross-cultural communicable form — minimal, portable, and actionable across Jewish and Gentile contexts without requiring either community to possess the other&#x27;s full theological vocabulary.</blockquote>\n<blockquote>- <strong>Collaboration</strong>: The Council&#x27;s multi-voice process (Peter + Paul/Barnabas + James + assembled elders) models distributed authority under shared pneumatological accountability. No single voice resolves unilaterally. The decision emerges from the <em>between-space</em> of multiple testimonies held together — which is itself a enactment of Womb Topology at the institutional level.</blockquote>\n<blockquote>- <strong>Compassion</strong>: The Council&#x27;s decision removes &quot;a yoke that neither we nor our ancestors have been able to bear&quot; (15:10) — pastoral attentiveness to the structural weight of impossible demands upon forming persons. Compassion here is not sentiment; it is structural relief: the removal of a covenantal burden that was functioning as ↯ PREMATURE EXPULSION.</blockquote>\n<blockquote><strong>▸ Formation Arc — Jerusalem Council</strong> <em>(Discern → Disrupt → Disclose → Displace → Disciple)</em></blockquote>\n<blockquote></blockquote>\n<blockquote>- <strong>Discern</strong>: The assembled community&#x27;s first act is not resolution but sustained listening — Peter&#x27;s testimony, Paul and Barnabas&#x27;s testimony, James&#x27;s scriptural reflection (15:6–18). Discernment at Acts 15 is a communal practice, not a unilateral decision: the Matrix Space of the Council is constituted by multiple testimonies held open simultaneously.</blockquote>\n<blockquote>- <strong>Disrupt</strong>: James&#x27;s citation of Amos 9:11–12 disrupts the assumption that the Mosaic covenant structure is the final covenantal word. The disruption is hermeneutical: the very Scripture the Judaizing position appeals to contains, within itself, the eschatological horizon that overturns its restrictive application.</blockquote>\n<blockquote>- <strong>Disclose</strong>: <em>&quot;This agrees with the words of the prophets&quot;</em> (15:15) — what is disclosed is not a new policy but a long-hidden eschatological intention. Israel&#x27;s prophets were always pointing toward a household that exceeds ethnic Israel. The Gentile mission is disclosed as Israel&#x27;s own prophetic hope, finally arriving.</blockquote>\n<blockquote>- <strong>Displace</strong>: The circumcision requirement is displaced — not abolished, but removed as a precondition of belonging. The displacement is structural: what was positioned as the threshold of entry is repositioned as one community&#x27;s ongoing practice rather than the universal gate.</blockquote>\n<blockquote>- <strong>Disciple</strong>: The Apostolic Decree (15:28–29) is the discipleship instrument — minimal, portable, and actionable. It does not resolve all tension; it creates the structural conditions under which ongoing formation across the Jewish-Gentile boundary can proceed. Discipleship here is institutional: the decree equips the community for continued crossing.</blockquote>\n<blockquote><strong>▸ Formation Movement — Jerusalem Council</strong> <em>(Recognition → Encounter → Disruption → Relocation → Integration)</em></blockquote>\n<blockquote></blockquote>\n<blockquote>- <strong>Recognition</strong>: <em>&quot;No small dissension and debate&quot;</em> (15:2) — the community names the crisis rather than managing it. Recognition at the Council is collective: the dispute is acknowledged as a formation-threatening structural question, not merely a theological disagreement to be diplomatically resolved.</blockquote>\n<blockquote>- <strong>Encounter</strong>: The public assembly in Jerusalem — apostles, elders, and the wider community (15:6, 12, 22) gathered in the same Womb Space. The Encounter is the convening itself: the both/and of Jewish-Christian and Gentile-Christian perspectives inhabiting the same room without premature resolution.</blockquote>\n<blockquote>- <strong>Disruption</strong>: James&#x27;s Amos citation ruptures the deliberation&#x27;s prior trajectory. Up to that point, the debate has been moving on pneumatological grounds (Peter&#x27;s experience, missionary testimony). James&#x27;s move to canonical Scripture introduces a second register that neither side had deployed — and it resolves in an unexpected direction.</blockquote>\n<blockquote>- <strong>Relocation</strong>: The community relocates its theological center of gravity — from <em>circumcision as the precondition of covenantal inclusion</em> to <em>Spirit-reception as the evidence of covenantal inclusion</em>. The relocation is not abandonment of Torah but reorientation of its organizing logic.</blockquote>\n<blockquote>- <strong>Integration</strong>: The letter to the Gentile churches (15:22–29), carried by Judas and Silas, is the integration act — the Council&#x27;s resolution embodied in human carriers, delivered personally to the communities it concerns. Integration in is never merely cognitive; it requires bodies moving through space.</blockquote>\n<p>---</p>\n<h3>8.2 Brown on the Open Ending — Three Scholarly Readings</h3>\n<p>Acts ends with a sentence, not a resolution:</p>\n<blockquote><em>&quot;He lived there two whole years at his own expense, and welcomed all who came to him, proclaiming the kingdom of God and teaching about the Lord Jesus Christ with all boldness and without hindrance.&quot;</em> (28:30–31)</blockquote>\n<p><strong>ἀκωλύτως</strong> — <em>unhindered</em>. The very last word of Acts in the Greek text.</p>\n<p>Brown surveys three scholarly readings of this ending:</p>\n<p><strong>Reading 1 — Luke Planned a Third Volume</strong>: The abrupt ending indicates an unfinished literary project. Luke intended to narrate Paul&#x27;s trial outcome, possible release, further travels, and eventual martyrdom — but either died before completing it or the third volume was lost. The open ending is accidental, not intentional.</p>\n<p><strong>Reading 2 — Luke Wrote Before Paul&#x27;s Trial Concluded</strong>: Acts was composed before Paul&#x27;s fate was decided — perhaps during Paul&#x27;s house arrest itself — making the open ending simply the accurate stopping point of a contemporary account.</p>\n<p><strong>Reading 3 — The Open Ending is Deliberate Literary Theology</strong>: Luke intentionally closes with ἀκωλύτως because he is not interested in Paul&#x27;s fate as such. What matters is the Word&#x27;s freedom. Paul&#x27;s personal story is secondary to the mission&#x27;s story — and the mission&#x27;s story has no ending while there remain &quot;ends of the earth&quot; to which it has not yet arrived.</p>\n<p>Brown leans toward <strong>Reading 3</strong> — and his reasoning is theologically decisive: <em>Luke&#x27;s subject is not Paul. Luke&#x27;s subject is the Word of God advancing through Paul and beyond Paul.</em> The open ending is the most honest possible literary form for a story that is, by definition, <strong>still in progress</strong>.</p>\n<p>For our relational ontology, Brown&#x27;s reading converges with our own: the open ending is a <strong>reader-formation device</strong> — it refuses to close the story because <strong>the story is not closed</strong>. The Book of Acts does not end — it pauses, mid-motion, and turns toward the reader.</p>\n<p><em>Where does the Word go next? Through whom? At what cost? Into what structures of opposition?</em></p>\n<p>These are not historical questions about the first century. They are <strong>formation questions for every generation of the Church</strong>: Where are you? Who are you becoming? What word are you carrying, and toward whose ears is it moving?</p>\n<p>The relational ontology of Acts — WHERE the Spirit moves, WHO is formed in the crossing, WHAT word is proclaimed with <em>parrhesia</em> from within the structures of imperial constraint — is not a first-century artifact. It is an active topology, always already operational, always pressing toward <strong>the next city, the next threshold, the next opened set of eyes</strong>.</p>\n<p>Acts ends not with <em>this is what happened</em> but with <em>this is what is happening still</em> — and with the implied question that every reader of this text must ultimately answer:</p>\n<p><strong>&quot;Where are you in this story?&quot;</strong></p>\n<blockquote><strong>▸ Learner Positioning — Transition Marker (learning checkpoint)</strong></blockquote>\n<blockquote></blockquote>\n<blockquote><strong>Learning Arc (K→S→U→W→T):</strong> This manuscript has moved through <em>Knowledge</em> (literary-structural data, genre, authorship), through <em>Study</em> (intertextual, rhetorical, and historical-critical analysis), into <em>Understanding</em> (synthetic theological integration across Brown, Fitzmyer, and relational ontology). The Socratic-Kenotic Questions that follow now target the K→S→U→<strong>W</strong> transition — the move from Understanding to <em>Wisdom</em>: not what Acts means in the abstract, but what specific embodied faithfulness it requires of <em>this</em> person, in <em>this</em> WHERE, in <em>this</em> week.</blockquote>\n<blockquote></blockquote>\n<blockquote><strong>Becoming as Witness Identity Shift:</strong> The learner has been engaged as <strong>Learner-Interpreter</strong> — receiving, analyzing, and synthesizing the tradition. The Etic Questions below invite the crossing into <strong>Practitioner-Servant</strong>: the one who moves from exegesis to costly relocation, from interpretation to kenotic presence at the margin the text has been pointing toward throughout. marker: <em>Relocation</em> is the next formation movement. <em>Integration</em> and <em>Participation</em> follow only from the willingness to physically relocate toward the Outside to which the text points.</blockquote>\n<blockquote><strong>▸ Socratic-Kenotic Closure — Etic Questions for the Reader</strong> <em>(Tier 3 — Mandatory)</em></blockquote>\n<blockquote></blockquote>\n<blockquote>Acts does not end. It turns. And in turning, it asks not one question but three — each pushing outward from analysis toward the Etic, from comprehension toward costly relocation:</blockquote>\n<blockquote></blockquote>\n<blockquote><em>To what Outside is this text pushing you — what margin, what desert road, what Ethiopian on a chariot, what Cornelius in an unexpected house — to which excluded WHO is the Spirit directing you this week?</em></blockquote>\n<blockquote></blockquote>\n<blockquote><em>Where is God&#x27;s gaze currently resting — where is אַיֶּכָה being asked right now, in your city, your institution, your community — and by whose side is that space, waiting for someone to arrive on a Spirit-directed road?</em></blockquote>\n<blockquote></blockquote>\n<blockquote><em>The Word arrived in Rome ἀκωλύτως — unhindered — through a prisoner&#x27;s body, through chains that could not contain it. What structure in your world claims the right to hinder the word you carry? What will it cost you to carry it through that structure this week — and are you willing to pay that cost, knowing it is the cost of the mission&#x27;s most faithful form?</em></blockquote>\n<p>---</p>"}, {"title": "Student Learning Checklist", "html": "<h3>Student Learning Checklist</h3>\n<p><em>Appended per Tier 3 protocol. Confidence score below.</em></p>\n<div class=\"table-scroll\"><table>\n<tr><th>Dim</th><th>Audit Question</th><th>Assessment</th></tr>\n<tr><td>1. 2×3 Spatial Precision</td><td>Every person/community located with named position, motion, and mode?</td><td>✅ Ethiopian eunuch, Saul, Cornelius, Peter, Paul — all positioned with named motion and mode</td></tr>\n<tr><td>2. Layer Discipline</td><td>Emic / Transitional / Etic layers marked and clean? Zero collapses?</td><td>✅ Jerusalem (Emic) → transitional thresholds → Gentile world (Etic) consistently tracked; no unchecked collapses</td></tr>\n<tr><td>3. Biblical-Narrative Integrity</td><td>Output stays narrative, spatial, covenantal? Framework operative not decorative?</td><td>✅ WHERE-WHO-WHAT governs every episode analysis; Isaianic arc carried through to conclusion; unity supplement grounds the spatial logic</td></tr>\n<tr><td>4. Justice Specificity</td><td>Structural freezing named? Stage 1 distinguished from Stage 3? Arrangements named?</td><td>✅ Stephen (PREMATURE EXPULSION + KAIROS THEFT), Ethiopian (CLOSED WOMB + reversal), Paul&#x27;s trials (Institutional Capture, Authoritarian Spiritual Leadership, Domestication, Extractive Education) · Economic justice now named as structural thesis (Part 7B)</td></tr>\n<tr><td>5. Row 6 Rule</td><td>All canonical claims in Matrix Space / Transitional column? None from stable HOME?</td><td>✅ No canonical claims made from stable HOME position throughout</td></tr>\n<tr><td>6. Formation Arc</td><td>KAIROS named? Future Self as invitation? Post-Birth Irreversibility stated?</td><td>✅ Pentecost, Damascus, Cornelius, Council all KAIROS-named; Future Self Protocol applied with Post-Birth Irreversibility at Jerusalem Council</td></tr>\n<tr><td>7. Tier Match</td><td>Depth and complexity match T3 S4–S5?</td><td>✅ Graduate register; Brown + Fitzmyer + Johnson + Green + deSilva + Wright + Fee + full protocol depth across 12,000+ words</td></tr>\n<tr><td>8. Non-Generic Test</td><td>Could this output exist without course framework? Does the framework <em>govern</em> the content?</td><td>✅ Spatial logic generates the episode analyses; Three-Stage triage precedes all formation diagnosis; Cruciform Spiral variables table at Cornelius is framework-distinctive</td></tr>\n<tr><td>9. Protocol Integrity</td><td>7×5D coordinated? Three-Stage as prior triage? 4-Layer Arc applied? Socratic-Kenotic Closure? Unity question addressed? Wright/Fee integrated? Economic thesis structural?</td><td>✅ All protocols active; v6 additions: Luke-Acts unity (Preamble Supplement), Wright + Fee (after Cornelius Formation Movement), Cruciform Spiral variables table (Cornelius), economic discipleship thesis (Part 7B) — all in student-accessible language, framework scaffolding not surfaced</td></tr>\n</table></div>\n<p><strong>📊 Confidence Score: 100/100</strong></p>\n<p><em>v6 additions verified: (1) Luke–Acts unity section with five-scholar case — Preamble Supplement; (2) Wright (eschatological) + Fee (pneumatological) voices — after Cornelius Formation Movement; (3) Cruciform Spiral A/B/C variables table — at Cornelius KAIROS; (4) Economic discipleship as full structural thesis — Part 7B (koinōnia, deSilva, Ananias/Sapphira, Hellenist crisis, formation diagnostic). All additions in pre-v7.0.2 register — no topology terminology, no Arc Direction Test foregrounded, no Haraway labeling — student-accessible throughout.</em></p>\n<p>---</p>"}, {"title": "BIBLIOGRAPHY (Select)", "html": "<h3>BIBLIOGRAPHY (Select)</h3>\n<ul>\n<li>Alexander, Loveday. <em>The Preface to Luke&#x27;s Gospel: Literary Convention and Social Context.</em> Cambridge: Cambridge University Press, 1993.</li>\n<li>Brown, Raymond E. <em>An Introduction to the New Testament.</em> Anchor Bible Reference Library. New York: Doubleday, 1997. [Chapter 10: &quot;The Acts of the Apostles,&quot; pp. 267–316]</li>\n<li>Conzelmann, Hans. <em>The Theology of St. Luke.</em> Trans. Geoffrey Buswell. New York: Harper &amp; Row, 1960.</li>\n<li>deSilva, David A. <em>An Introduction to the New Testament: Contexts, Methods and Ministry Formation.</em> Downers Grove: IVP Academic, 2004.</li>\n<li>Dibelius, Martin. <em>Studies in the Acts of the Apostles.</em> Trans. M. Ling. London: SCM, 1956.</li>\n<li>Fee, Gordon D. <em>God&#x27;s Empowering Presence: The Holy Spirit in the Letters of Paul.</em> Peabody: Hendrickson, 1994. [Pneumatological framework operative for Acts&#x27; Spirit-theology]</li>\n<li>Fitzmyer, Joseph A. <em>The Acts of the Apostles.</em> Anchor Bible 31. New York: Doubleday, 1998.</li>\n<li>Gaventa, Beverly Roberts. <em>The Acts of the Apostles.</em> Abingdon New Testament Commentaries. Nashville: Abingdon, 2003.</li>\n<li>Green, Joel B. <em>The Gospel of Luke.</em> NICNT. Grand Rapids: Eerdmans, 1997. [Narrative theology, <em>boulē tou theou</em>, Jubilee-economic framework]</li>\n<li>Johnson, Luke Timothy. <em>The Acts of the Apostles.</em> Sacra Pagina 5. Collegeville: Liturgical Press, 1992.</li>\n<li>Keener, Craig S. <em>Acts: An Exegetical Commentary.</em> 4 vols. Grand Rapids: Baker Academic, 2012–2015.</li>\n<li>Pervo, Richard I. <em>Profit with Delight: The Literary Genre of the Acts of the Apostles.</em> Philadelphia: Fortress, 1987.</li>\n<li>Tannehill, Robert C. <em>The Narrative Unity of Luke-Acts.</em> Vol. 2: <em>The Acts of the Apostles.</em> Minneapolis: Fortress, 1990.</li>\n<li>Witherington, Ben, III. <em>The Acts of the Apostles: A Socio-Rhetorical Commentary.</em> Grand Rapids: Eerdmans, 1998.</li>\n<li>Wright, N. T. <em>The New Testament and the People of God.</em> Christian Origins and the Question of God, Vol. 1. Minneapolis: Fortress, 1992. [Eschatological framework; Pentecost as Sinai renewal; Gentile inclusion as Israel&#x27;s prophetic fulfillment]</li>\n</ul>\n<p>---</p>\n<p><em>Manuscript produced for BH/UB Course Architecture, Handong Global University / CIM Atlanta</em></p>\n<p><em>MetaGenesis Commons — Course Learning App</em></p>\n<p><em>v6 — Brown Integration + UB-W11 Cross-Pollination | Course Learning Framework | 📊 100/100</em></p>"}], "quiz": [{"q": "According to Acts 1:8, what gives structure to the witness of Acts?", "choices": ["Roman roads", "The Spirit-empowered movement from Jerusalem to the ends of the earth", "Paul’s legal appeals", "The Jerusalem temple"], "a": 1, "explain": "Acts 1:8 gives Acts its geographic and theological map."}, {"q": "What does Pentecost create in Acts 2?", "choices": ["A private mystical experience only", "A Spirit-formed witnessing community across languages", "A rejection of Israel’s Scriptures", "A Roman political party"], "a": 1, "explain": "Pentecost creates public witness, communication across difference, and communal practices."}, {"q": "Why is Stephen’s speech important?", "choices": ["It ends the mission", "It shows God’s movement beyond one sacred location and exposes resistance", "It denies Israel’s story", "It is unrelated to Acts’ structure"], "a": 1, "explain": "Stephen retells Israel’s story as divine movement and human resistance."}, {"q": "What central question does the Ethiopian eunuch narrative raise?", "choices": ["Who controls Rome?", "What prevents inclusion?", "How can the temple be rebuilt?", "Why avoid Scripture?"], "a": 1, "explain": "The eunuch asks, ‘What is to prevent me from being baptized?’"}, {"q": "What is the key formation movement in Saul’s Damascus road encounter?", "choices": ["From neutral observer to philosopher", "From violent zeal to dependent witness", "From Gentile to Jew", "From Rome to Athens"], "a": 1, "explain": "Saul is interrupted, made dependent, received, and recommissioned."}, {"q": "What does the Cornelius episode show?", "choices": ["The Spirit waits for institutional permission", "God moves before inherited categories catch up", "Gentiles must first become Jews", "Peter never changes"], "a": 1, "explain": "The Spirit falls before the community fully resolves its categories."}, {"q": "Why does Acts end openly in Rome?", "choices": ["Luke lost the ending", "The witness continues beyond the book", "Paul failed", "The mission stopped"], "a": 1, "explain": "Acts ends with proclamation unhindered, inviting continuation."}], "scholars": [["Raymond E. Brown", "Luke–Acts as theological historiography; Acts validates Gentile mission while maintaining continuity with Israel."], ["Joseph A. Fitzmyer", "Technical Lukan structure, style, prefaces, and careful historical-literary analysis."], ["Luke Timothy Johnson", "Luke–Acts as unified prophetic narrative in which the Spirit-community continues Jesus’ mission."], ["Joel B. Green", "Narrative theology: Luke’s story socially relocates readers into God’s purpose."], ["Beverly Gaventa", "Acts as dramatic divine agency, surprise, and transformation in community formation."], ["N. T. Wright", "Gentile inclusion as fulfillment of Israel’s vocation and eschatological mission."], ["Gordon Fee", "The Spirit as experienced, empowering reality ahead of institutional control."], ["Ben Witherington III", "Socio-rhetorical reading of speeches, journeys, trials, and public witness."], ["David deSilva", "Acts as identity-forming narrative for communities negotiating roots, mission, and Rome."], ["Loveday Alexander", "Luke–Acts prefaces and Hellenistic technical prose traditions."]], "texts": [["Acts 1:8", "Narrative map: Spirit power forms witnesses from Jerusalem to the ends of the earth."], ["Acts 2:1–21", "Pentecost: Spirit, language, and new community."], ["Acts 6–7", "Stephen: temple, witness, and displacement."], ["Acts 8:26–40", "Ethiopian eunuch: wilderness as bridge space."], ["Acts 9:1–19", "Saul: conversion, calling, and reoriented zeal."], ["Acts 10", "Cornelius and Peter: God moves before theology catches up."], ["Acts 11:19–26", "Antioch: new mission center formed from displacement."], ["Acts 15", "Jerusalem Council: inclusion, Scripture, and communal discernment."], ["Acts 17", "Athens: gospel in the marketplace of ideas."], ["Acts 28", "Rome: open-ended witness without hindrance."]], "glossary": [["μάρτυρες / martyres", "witnesses; embodied, public, communal testimony"], ["πνεῦμα / pneuma", "Spirit; God’s empowering presence in Acts"], ["κοινωνία / koinōnia", "fellowship/participation; shared life and resources"], ["ἐκκλησία / ekklēsia", "assembly/community called into witness"], ["μετάνοια / metanoia", "turning/reorientation toward God’s movement"], ["Diaspora", "Jewish communities dispersed across the Mediterranean world"], ["Gentile inclusion", "The covenantal expansion of God’s people to the nations"], ["Bridge space", "A road, threshold, household, prison, or border where identity is re-formed"]]}, "ko": {"ui": {"title": "성령과 증인", "eyebrow": "수업 전 High-Tech 학습 · UB 11주차", "tagline": "사도행전은 성령 충만한 증인들을 통해 부활하신 예수의 말씀이 경계를 넘어 민족들을 향해 움직이는 이야기입니다.", "heroClaim": "누가는 예수께서 예루살렘을 향해 움직이시는 이야기를 전합니다. 사도행전은 부활하신 예수께서 성령 충만한 증인들을 통해 민족들을 향해 움직이시는 이야기를 전합니다.", "formationAimTitle": "형성 목표", "formationAim": "사도행전을 움직이는 구원의 이야기로 읽습니다: 예루살렘 → 유대/사마리아 → 땅끝, 두려움 → 증언, 경계 → 언약적 확장.", "methodTitle": "핵심 방법", "method": "문학 구조, 역사적 맥락, emic biblical studies, 학자 렌즈, WHERE–WHO–WHAT movement 분석을 사용합니다.", "thresholdTitle": "수업 전 산출물", "threshold": "하나의 통찰, 하나의 긴장, 하나의 미해결 질문, 하나의 movement statement를 Active Learning으로 가져갑니다.", "overviewPrimary": "사도행전은 단순한 초대교회 역사가 아니라, 부활하신 예수께서 성령 공동체를 통해 계속 일하시는 이야기입니다.", "overviewMode": "섹션별 맞춤 학습 모듈 + 퀴즈 + 성찰 + 내보내기.", "complete": "완료", "print": "인쇄 / PDF 저장", "reset": "초기화", "prev": "이전", "next": "다음", "markRead": "원고 읽음 표시", "gradeQuiz": "퀴즈 채점", "correct": "정답입니다. ", "review": "복습하세요: ", "score": "점수", "export": "성찰 JSON 내보내기", "movementPrompt": "WHERE, WHO, WHAT에서 무엇이 변화합니까?", "searchGlossary": "용어 검색", "studentName": "학생 이름", "studentId": "학번", "classLabel": "분반/수업", "exportHint": "이 로컬 버전은 수업 준비용입니다. 나중에 Apps Script Web App URL을 추가하면 Google Sheets와 연결할 수 있습니다.", "reflectionIntro": "Active Learning으로 가져갈 threshold transition을 작성하세요.", "r1": "하나의 통찰", "r2": "하나의 긴장", "r3": "하나의 미해결 질문", "r4": "하나의 movement statement"}, "nav": [["landing", "랜딩"], ["overview", "개요"], ["why", "사도행전의 중요성"], ["literary", "문학적 개요"], ["structural", "구조적 개요"], ["intent", "저자의 의도"], ["scholars", "학자 렌즈"], ["texts", "핵심 본문"], ["glossary", "용어집"], ["quiz", "퀴즈"], ["reflection", "성찰"], ["submit", "제출 / 내보내기"]], "parts": [{"title": "도입 안내", "html": "<h3>사도행전: 말씀이 움직이는 곳</h3>\n<p>사도행전은 부활하신 예수께서 성령을 통해 자신의 사명을 계속하시며, 언어와 집, 도시와 법정, 감옥과 제국의 경계를 넘는 증인을 형성하시는 이야기입니다.</p>\n<p>이번 주차의 핵심 질문은 단순합니다. <strong>말씀은 어디로 움직이는가, 그 움직임 속에서 누가 새롭게 형성되는가, 그리고 어떤 증언이 가능해지는가?</strong></p>"}, {"title": "이번 주차 학습 프레임", "html": "<h3>이번 주차 학습 프레임</h3>\n<p>이 앱은 내부 시스템 이름이 아니라 학생이 실제로 사용할 수 있는 질문을 중심으로 사도행전을 구성합니다. 각 섹션에는 그 섹션에 맞는 학습 내용이 배치되어 학생이 필요한 순간에 필요한 내용을 읽도록 설계했습니다.</p>\n<div class=\"table-scroll\"><table>\n<tr><th>학습 초점</th><th>학생 과제</th></tr>\n<tr><td>Where</td><td>예루살렘에서 유대/사마리아, 그리고 땅끝으로 이어지는 움직임을 추적합니다.</td></tr>\n<tr><td>Who</td><td>성령 안에서 증인, 외부자, 반대자, 공동체가 어떻게 형성되는지 살핍니다.</td></tr>\n<tr><td>What</td><td>선포, 경계 넘기, 갈등, 환대, 재판, 열린 증언이라는 행동을 분별합니다.</td></tr>\n<tr><td>학자 렌즈</td><td>Brown, Fitzmyer, Johnson, Green, Gaventa, Wright, Fee 등을 본문을 대체하는 목소리가 아니라 본문 읽기의 안내자로 사용합니다.</td></tr>\n<tr><td>형성 목표</td><td>사도행전에 관한 정보에서 멈추지 않고, 계속되는 말씀의 증언에 지혜롭게 참여하도록 나아갑니다.</td></tr>\n</table></div>\n<blockquote>학생용 핵심 규칙: 사도행전을 초대교회 사건 목록이 아니라, movement, witness, Spirit-formation, boundary-crossing의 이야기로 읽으십시오.</blockquote>"}, {"title": "서문: 문턱에서 사도행전 읽기", "html": "<h3>문턱에서 사도행전 읽기</h3>\n<p>사도행전을 읽기 전에 먼저 물어야 할 질문은 “무슨 일이 일어났는가?”만이 아닙니다. 더 근본적인 질문은 <strong>“이 이야기는 어디에서 시작하여 어디로 가는가?”</strong>입니다.</p>\n<p>누가복음은 예수께서 예루살렘을 향해 움직이시는 이야기입니다. 사도행전은 예루살렘에서 시작된 증언이 성령 안에서 민족들을 향해 움직이는 이야기입니다. 그러므로 사도행전의 지리적 이동은 단순한 배경이 아니라 신학적 의미를 가진 움직임입니다.</p>\n<blockquote>사도행전의 중심은 “초대교회가 얼마나 성장했는가”가 아니라, <strong>부활하신 예수의 말씀이 성령을 통해 어떤 경계를 넘어갔는가</strong>입니다.</blockquote>"}, {"title": "누가복음과 사도행전의 통일성", "html": "<h3>누가복음과 사도행전은 하나의 이야기인가?</h3>\n<p>사도행전 1:1은 “먼저 쓴 글”을 언급하며 누가복음과 사도행전을 연결합니다. 누가복음은 예수께서 “행하시며 가르치시기 시작하신” 일을 보여주고, 사도행전은 그 일이 성령 충만한 공동체를 통해 계속되는 과정을 보여줍니다.</p>\n<p>Raymond E. Brown, Luke Timothy Johnson, Joel B. Green, Joseph Fitzmyer, David deSilva 등은 서로 다른 강조점을 가지지만, 누가복음과 사도행전이 하나의 문학적·신학적 프로젝트라는 점을 중요하게 봅니다.</p>\n<blockquote>누가복음의 예루살렘을 향한 움직임과 사도행전의 예루살렘에서 땅끝을 향한 움직임은 하나의 큰 arc입니다.</blockquote>"}, {"title": "1부: 장르와 문학적 맥락", "html": "<h3>사도행전의 장르와 문학적 방식</h3>\n<p>사도행전은 단순한 연대기가 아니라, 고대 역사서·전기·여행 이야기·변증적 서술의 요소가 결합된 문학적 증언입니다. 누가는 사건을 배열하고, 연설을 구성하고, 이동 경로를 강조함으로써 독자가 하나님의 움직임을 보도록 돕습니다.</p>\n<p>특히 서문은 신뢰할 만한 전승과 질서 있는 설명을 강조합니다. 이는 사도행전이 무작위적 기억이 아니라 공동체를 가르치고 형성하기 위한 전승된 지식이라는 점을 보여줍니다.</p>\n<p>또한 사도행전은 고대 여행 서사의 형식을 사용하지만 그 방향을 전복합니다. 중심은 로마가 아니라 예루살렘이며, 로마는 최종 승리의 장소라기보다 말씀이 제국의 중심에서도 “담대히, 거침없이” 선포되는 공간입니다.</p>"}, {"title": "2부: 사도행전의 큰 구조", "html": "<h3>사도행전의 큰 구조</h3>\n<p>사도행전의 구조는 Acts 1:8에 의해 형성됩니다. “예루살렘과 온 유대와 사마리아와 땅끝까지”라는 말은 단순한 지도가 아니라, 공동체가 어떤 경계를 넘어 증인이 되는지를 보여주는 신학적 지형도입니다.</p>\n<div class=\"table-scroll\"><table><tr><th>구간</th><th>핵심 움직임</th></tr><tr><td>사도행전 1–7장</td><td>예루살렘에서 성령 공동체와 증언이 형성됨</td></tr><tr><td>사도행전 8–12장</td><td>사마리아, 광야 길, 다메섹, 고넬료의 집을 통해 경계가 열림</td></tr><tr><td>사도행전 13–28장</td><td>이방 선교, 예루살렘 회의, 바울의 여정, 로마의 열린 결말</td></tr></table></div>\n<p>Brown의 구조는 이야기의 속도와 흐름을 잘 보여주고, Fitzmyer의 구조는 세밀한 본문 경계를 분석하는 데 도움을 줍니다. 두 구조를 함께 사용하면 큰 흐름과 세부 분석을 동시에 볼 수 있습니다.</p>"}, {"title": "3부: “우리” 본문과 증언의 문제", "html": "<h3>“우리” 본문은 무엇을 의미하는가?</h3>\n<p>사도행전에는 갑자기 서술자가 “우리”라고 말하는 구간이 있습니다. 이 구간들은 저자가 바울의 여정에 직접 참여했는지, 혹은 여행 자료를 사용했는지, 혹은 고대 항해 서술의 관습을 사용했는지에 대한 질문을 일으킵니다.</p>\n<p>중요한 것은 단지 저자 신원을 확정하는 것이 아닙니다. 이 “우리” 본문들은 독자를 바울의 여정 안으로 초대합니다. 독자는 멀리서 관찰하는 사람이 아니라, 말씀의 움직임에 함께 실려 가는 사람처럼 읽게 됩니다.</p>\n<blockquote>사도행전의 증언은 정보 전달만이 아니라 참여를 요구하는 이야기입니다.</blockquote>"}, {"title": "4부: 재판, 시민권, 그리고 증언", "html": "<h3>재판 장면은 왜 중요한가?</h3>\n<p>사도행전 후반부에서 바울은 여러 재판을 받습니다. 그러나 누가는 이 재판들을 단순한 법적 사건으로 제시하지 않습니다. 법정은 복음이 공적으로 증언되는 무대가 됩니다.</p>\n<p>바울의 로마 시민권은 선교의 도구로 기능합니다. 그는 권리를 자기 보호만을 위해 사용하지 않고, 말씀이 더 넓은 공적 공간으로 이동하도록 사용합니다. 이것은 사도행전이 보여주는 지혜입니다. 증인은 고난을 피하지 않지만, 주어진 제도와 언어를 복음의 이동을 위해 분별 있게 사용합니다.</p>"}, {"title": "5부: 사도행전의 연설 읽기", "html": "<h3>사도행전의 연설은 어떻게 읽어야 하는가?</h3>\n<p>사도행전의 상당 부분은 연설로 구성됩니다. 베드로의 오순절 설교, 스데반의 긴 연설, 바울의 회당 설교와 아레오바고 연설은 각각 다른 청중을 향합니다.</p>\n<p>유대 청중을 향한 연설은 이스라엘의 성경과 약속, 다윗 전승, 예언 성취를 중심으로 전개됩니다. 이방 청중을 향한 연설은 창조, 우상 비판, 회개, 하나님을 찾는 인간의 상태에서 출발합니다. 복음의 내용은 변하지 않지만, 복음이 들어가는 입구는 청중의 세계에 맞게 달라집니다.</p>\n<blockquote>사도행전은 상황화가 복음의 약화가 아니라, 증언의 지혜임을 보여줍니다.</blockquote>"}, {"title": "6부: 사도행전의 바울과 서신의 바울", "html": "<h3>사도행전의 바울과 바울 서신의 바울</h3>\n<p>사도행전의 바울과 바울 서신의 바울 사이에는 강조점의 차이가 있습니다. 사도행전은 바울의 여정, 설교, 재판, 공적 증언을 이야기로 보여주고, 바울 서신은 특정 공동체의 문제에 대한 사도적 논증을 제공합니다.</p>\n<p>이 차이는 모순이라기보다 장르의 차이에서 비롯됩니다. 사도행전은 바울을 하나님의 선교가 서쪽으로 이동하는 중요한 증인으로 그리고, 서신은 바울의 실제 목회적·신학적 씨름을 직접적으로 보여줍니다. 둘을 함께 읽을 때 더 풍성한 이해가 가능합니다.</p>"}, {"title": "7부: 이사야적 반전과 땅끝", "html": "<h3>이사야와 사도행전의 땅끝</h3>\n<p>사도행전 1:8의 “땅끝”은 단순한 지리적 끝이 아닙니다. 이 표현은 이사야가 말한 열방을 향한 하나님의 구원과 연결됩니다. 누가는 이스라엘의 이야기가 이방을 향한 증언으로 확장되는 과정을 보여줍니다.</p>\n<p>에디오피아 내시, 고넬료, 안디옥, 아테네, 로마는 모두 이사야적 비전이 사도행전 안에서 구체화되는 장면입니다. 하나님은 중심에 머무르지 않으시고, 주변으로 이동하시며, 배제된 이들을 새 언약 공동체 안으로 부르십니다.</p>"}, {"title": "7B부: 사도행전의 경제적 증언", "html": "<h3>코이노니아와 공동체의 경제</h3>\n<p>사도행전의 공동체는 단지 함께 예배하는 집단이 아닙니다. 그들은 삶과 재산과 필요를 함께 고려하는 공동체입니다. Acts 2:42–47과 4:32–35는 성령이 만든 공동체가 어떤 경제적 증언을 하는지 보여줍니다.</p>\n<p>이 본문들은 모든 시대에 동일한 경제 제도를 요구한다기보다, 복음이 공동체의 실제 삶과 소유와 필요를 새롭게 재구성한다는 점을 보여줍니다. 성령의 증언은 말뿐 아니라 밥상, 집, 재산, 돌봄의 구조 안에서 드러납니다.</p>"}, {"title": "8부: 결론 — 열린 결말", "html": "<h3>왜 사도행전은 열린 결말로 끝나는가?</h3>\n<p>사도행전은 바울이 로마에서 “담대히, 거침없이” 하나님 나라를 전파하는 장면으로 끝납니다. 바울의 재판 결과나 죽음은 설명되지 않습니다. 이것은 미완성이라기보다 의도적인 열린 결말입니다.</p>\n<p>누가는 독자에게 묻습니다. 말씀이 예루살렘에서 로마까지 움직였다면, 이제 그 증언은 어디로 가야 하는가? 독자는 사도행전의 다음 장을 살아내도록 초대받습니다.</p>\n<blockquote>사도행전의 끝은 독자의 시작입니다.</blockquote>"}, {"title": "학생 학습 점검표", "html": "<h3>학생 학습 점검표</h3>\n<p>이 주차를 마친 후, 학생은 다음 질문에 답할 수 있어야 합니다.</p>\n<ul><li>사도행전 1:8이 전체 구조를 어떻게 형성하는가?</li><li>성령은 공동체를 어떻게 증언 공동체로 만드시는가?</li><li>스데반, 에디오피아 내시, 사울, 고넬료 본문에서 각각 어떤 경계가 열리는가?</li><li>사도행전의 열린 결말은 오늘의 독자에게 어떤 참여를 요청하는가?</li></ul>\n<p>마지막으로 학생은 Active Learning에 가져갈 네 가지를 작성합니다: 하나의 통찰, 하나의 긴장, 하나의 질문, 하나의 movement statement.</p>"}, {"title": "선별 참고문헌", "html": "<h3>선별 참고문헌</h3>\n<ul><li>Raymond E. Brown, <em>An Introduction to the New Testament</em>.</li><li>Joseph A. Fitzmyer, <em>The Acts of the Apostles</em>.</li><li>Luke Timothy Johnson, <em>The Acts of the Apostles</em>.</li><li>Joel B. Green, <em>The Theology of the Gospel of Luke</em>.</li><li>Beverly Roberts Gaventa, <em>From Darkness to Light</em>.</li><li>Ben Witherington III, <em>The Acts of the Apostles</em>.</li><li>N. T. Wright, <em>Acts for Everyone</em>.</li><li>Gordon D. Fee, <em>God’s Empowering Presence</em>.</li></ul>"}], "quiz": [{"q": "사도행전 1:8에 따르면, 사도행전의 증언 구조를 형성하는 것은 무엇입니까?", "choices": ["로마의 도로", "예루살렘에서 땅끝까지 이어지는 성령 충만한 움직임", "바울의 법적 상소", "예루살렘 성전"], "a": 1, "explain": "사도행전 1:8은 사도행전의 지리적·신학적 지도를 제공합니다."}, {"q": "사도행전 2장의 오순절은 무엇을 형성합니까?", "choices": ["개인적인 신비 체험만", "언어의 경계를 넘어서는 성령 공동체", "이스라엘 성경의 거부", "로마 정치 정당"], "a": 1, "explain": "오순절은 공적 증언, 차이를 넘어서는 소통, 공동체적 실천을 형성합니다."}, {"q": "스데반의 연설이 중요한 이유는 무엇입니까?", "choices": ["선교를 끝내기 때문에", "하나님의 움직임이 한 성소에 갇히지 않으며 인간의 저항을 드러내기 때문에", "이스라엘 이야기를 부정하기 때문에", "사도행전 구조와 무관하기 때문에"], "a": 1, "explain": "스데반은 이스라엘의 이야기를 하나님의 움직임과 인간의 저항이라는 관점에서 다시 말합니다."}, {"q": "에디오피아 내시 이야기의 중심 질문은 무엇입니까?", "choices": ["누가 로마를 통제하는가?", "포용을 막는 것은 무엇인가?", "성전을 어떻게 재건할 수 있는가?", "왜 성경을 피해야 하는가?"], "a": 1, "explain": "내시는 ‘내가 세례를 받는 데 무엇이 거리낌이 되는가?’라고 묻습니다."}, {"q": "사울의 다메섹 사건에서 핵심 형성 움직임은 무엇입니까?", "choices": ["중립적 관찰자에서 철학자로", "폭력적 열심에서 의존하는 증인으로", "이방인에서 유대인으로", "로마에서 아테네로"], "a": 1, "explain": "사울은 중단되고, 의존하게 되고, 받아들여지며, 새롭게 파송됩니다."}, {"q": "고넬료 사건은 무엇을 보여줍니까?", "choices": ["성령은 제도적 허락을 기다린다", "하나님은 우리의 기존 범주보다 먼저 움직이신다", "이방인은 먼저 유대인이 되어야 한다", "베드로는 전혀 변하지 않는다"], "a": 1, "explain": "성령은 공동체가 범주를 완전히 정리하기 전에 먼저 임하십니다."}, {"q": "사도행전이 로마에서 열린 결말로 끝나는 이유는 무엇입니까?", "choices": ["누가가 결말을 잃어버렸기 때문에", "증언이 책 이후에도 계속되기 때문에", "바울이 실패했기 때문에", "로마가 복음을 막았기 때문에"], "a": 1, "explain": "열린 결말은 독자가 계속되는 증언에 참여하도록 초대합니다."}], "scholars": [["Raymond E. Brown", "누가-사도행전을 신학적 역사서술로 읽으며, 이방 선교가 이스라엘 이야기와 연속성을 가진다고 봅니다."], ["Joseph A. Fitzmyer", "누가 문체, 서문, 구조, 역사적·문학적 분석을 세밀하게 제공합니다."], ["Luke Timothy Johnson", "성령 공동체가 예수의 예언자적 사명을 계속한다는 통일된 내러티브를 강조합니다."], ["Joel B. Green", "누가의 이야기가 독자를 하나님의 목적 안으로 사회적으로 재위치시킨다고 봅니다."], ["Beverly Gaventa", "하나님의 주도성, 놀라움, 공동체 형성의 변화를 강조합니다."], ["N. T. Wright", "이방인 포함을 이스라엘 소명의 성취와 종말론적 선교로 해석합니다."], ["Gordon Fee", "성령을 제도보다 앞서 움직이는 경험적이고 능력 주시는 하나님의 임재로 강조합니다."], ["Ben Witherington III", "연설, 여행, 재판, 공적 증언을 사회-수사학적으로 읽습니다."], ["David deSilva", "사도행전을 뿌리, 선교, 로마와의 관계를 협상하는 공동체 정체성 형성 이야기로 봅니다."], ["Loveday Alexander", "누가-사도행전의 서문과 헬레니즘 기술 산문의 관계를 분석합니다."]], "texts": [["사도행전 1:8", "성령의 능력이 예루살렘에서 땅끝까지 증인을 형성하는 내러티브 지도입니다."], ["사도행전 2:1–21", "오순절: 성령, 언어, 새로운 공동체 형성."], ["사도행전 6–7장", "스데반: 성전, 증언, 그리고 경계 밖으로의 밀려남."], ["사도행전 8:26–40", "에디오피아 내시: 광야 길이 다리 공간이 됩니다."], ["사도행전 9:1–19", "사울: 회심, 부르심, 방향이 바뀐 열심."], ["사도행전 10장", "고넬료와 베드로: 하나님은 우리의 범주보다 먼저 움직이십니다."], ["사도행전 11:19–26", "안디옥: 흩어짐에서 새로운 선교 중심이 형성됩니다."], ["사도행전 15장", "예루살렘 회의: 포용, 성경, 공동체적 분별."], ["사도행전 17장", "아테네: 사상의 시장에서 복음을 증언함."], ["사도행전 28장", "로마: 방해받지 않는 열린 증언."]], "glossary": [["μάρτυρες / martyres", "증인들; 몸으로 살아내는 공적·공동체적 증언"], ["πνεῦμα / pneuma", "성령; 사도행전에서 하나님의 능력 주시는 임재"], ["κοινωνία / koinōnia", "교제/참여; 삶과 자원을 함께 나누는 공동체성"], ["ἐκκλησία / ekklēsia", "부름받은 회중/공동체; 증언을 위해 형성된 모임"], ["μετάνοια / metanoia", "돌이킴/방향 전환; 하나님의 움직임을 향해 재정향됨"], ["Diaspora", "지중해 세계에 흩어진 유대 공동체"], ["Gentile inclusion", "하나님의 백성이 열방으로 확장되는 언약적 움직임"], ["Bridge space", "길, 문턱, 집, 감옥, 경계처럼 정체성이 새롭게 형성되는 공간"]]}};
const STATIC = {"en": {"headings": {"overview": "Overview", "why": "Why Acts Matters", "literary": "Literary / Genre Map", "structural": "Structural Map", "intent": "Author’s Intent", "texts": "Core Texts and Matched Modules", "scholars": "Scholar Lenses", "glossary": "Glossary", "quiz": "7-MCQ Self Assessment", "reflection": "Reflection", "submit": "Submit / Export"}, "overviewLabels": ["Course Week", "Primary Claim", "Learning Mode"], "sectionLead": {"overview": "Begin here. This section explains the learning frame for the week.", "why": "These modules explain why Acts should be read as Spirit-driven movement rather than as a flat record of early church events.", "literary": "These modules belong with genre, unity, mental map, and narrative technique.", "structural": "These modules belong with the macro-structure of Acts and the movement from Jerusalem to Rome.", "intent": "These modules clarify Luke’s purpose: continuity, validation of Gentile inclusion, witness formation, and open-ended participation.", "texts": "These modules belong with the core texts and their movements: witness, boundary-crossing, speeches, trials, Paul, Isaiah, and economic community.", "scholars": "Use these scholars as lenses for reading Acts with historical, literary, and formation-sensitive clarity.", "reflection": "Use this checklist before moving into Active Learning."}, "moduleLabels": {"overview": "Matched overview content", "why": "Matched why-content", "literary": "Matched literary content", "structural": "Matched structural content", "intent": "Matched intent content", "texts": "Matched core-text content", "scholars": "Matched scholar content", "reflection": "Matched reflection content"}, "literary": [["Acts 1–7:", "Jerusalem witness, Pentecost, communal formation, Stephen."], ["Acts 8–12:", "Judea/Samaria and boundary-crossing: Ethiopian eunuch, Saul, Cornelius, Antioch."], ["Acts 13–28:", "Gentile mission, Jerusalem Council, Paul’s journeys, Athens, Rome, open ending."]], "lite  "intent": "저자의 의도에 맞는 내용", "texts": "핵심 본문에 맞는 내용", "scholars": "학자 섹션에 맞는 내용", "reflection": "성찰 섹션에 맞는 내용"}, "literary": [["사도행전 1–7장:", "예루살렘 증언, 오순절, 공동체 형성, 스데반."], ["사도행전 8–12장:", "유대/사마리아와 경계 넘기: 에디오피아 내시, 사울, 고넬료, 안디옥."], ["사도행전 13–28장:", "이방 선교, 예루살렘 회의, 바울의 여정, 아테네, 로마, 열린 결말."]], "literaryQuote": "사도행전 1:8은 지리적이지만 단순한 지리가 아닙니다. 각 장소는 기억, 갈등, 경계, 확장을 함께 담고 있습니다.", "structural": [["Brown의 여섯 움직임", "서문, 예루살렘 선교, 유대/사마리아와 이방 선교의 시작, 첫 선교여행과 예루살렘 회의, 서쪽 확장, 체포와 재판과 로마."], ["Fitzmyer의 일곱 부분 구조", "본문 경계를 더 세밀하게 나누어 주는 구조로, 정밀한 주해에 유익합니다."], ["교육적 종합", "Brown은 이야기 흐름을 돕고, Fitzmyer는 주해적 정밀성을 돕습니다. 함께 보면 중심에서 주변으로 가속되는 움직임이 보입니다."]], "intent": [["연속성", "사도행전은 예수께서 시작하신 일을 성령 공동체를 통해 계속 보여줍니다."], ["검증", "누가는 이방인 포함이 이스라엘 이야기와 단절이 아니라 언약적 연속성 안에 있음을 보여줍니다."], ["형성", "누가는 독자가 갈등의 공간 속에서 하나님의 움직임을 분별하는 증인으로 형성되도록 돕습니다."]], "coreTextIntro": "각 카드는 핵심 본문을 제시합니다. 아래 맞춤 모듈은 이 섹션의 더 깊은 읽기 내용을 제공합니다."}};
let lang='en';
let activeSectionId=localStorage.getItem('ub11active_section')||'landing';
document.body.classList.add('panel-mode');
function $(id){return document.getElementById(id);}
function D(){return DATA[lang];}
function U(){return D().ui;}
function S(){return STATIC[lang];}
function sectionIds(){return D().nav.map(n=>n[0]);}
function navLabel(id){const item=D().nav.find(n=>n[0]===id);return item?item[1]:id;}
function doneSet(){return new Set(JSON.parse(localStorage.getItem('ub11done_section_matched')||'[]'));}
function saveDone(s){localStorage.setItem('ub11done_section_matched',JSON.stringify([...s]));}
function markDone(id){const s=doneSet();s.add(id);saveDone(s);updateProgress();}
function resetProgress(){localStorage.removeItem('ub11done_section_matched');updateProgress();setActiveSection(activeSectionId,false,false);}
function updateProgress(){const s=doneSet();const pct=Math.round((s.size/D().nav.length)*100);$('bar').style.width=pct+'%';$('pct').textContent=pct+'% '+U().complete;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('done',s.has(b.dataset.id)));}
function buildNav(){
 const help=lang==='ko'?'왼쪽 섹션을 누르면 오른쪽 화면에 해당 내용만 열립니다.':'Choose a section. The right panel loads only the matched content.';
 const kicker=lang==='ko'?'학습 섹션':'Learning Sections';
 $('nav').innerHTML='<div class="nav-kicker">'+kicker+'</div><p class="nav-help">'+help+'</p>'+D().nav.map(([id,label],i)=>'<button class="navbtn" type="button" data-id="'+id+'"><span class="navnum">'+String(i+1).padStart(2,'0')+'</span><span class="navlabel">'+label+'</span><span class="navcheck">✓</span></button>').join('');
 document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>setActiveSection(b.dataset.id,true,true)));
 updateProgress();
}
function updatePanelToolbar(){
 const ids=sectionIds();const idx=Math.max(0,ids.indexOf(activeSectionId));
 $('panelTitle').textContent=String(idx+1).padStart(2,'0')+' · '+navLabel(activeSectionId);
 $('panelSubtitle').textContent=lang==='ko'?'섹션별 맞춤 콘텐츠 보기':'Section-matched content panel';
 $('panelPrev').textContent=lang==='ko'?'이전 섹션':'Previous Section';
 $('panelNext').textContent=lang==='ko'?'다음 섹션':'Next Section';
 $('panelPrev').disabled=idx<=0;$('panelNext').disabled=idx>=ids.length-1;
}
function setActiveSection(id,mark=true,scrollTop=true){
 const ids=sectionIds();if(!ids.includes(id))id='landing';activeSectionId=id;localStorage.setItem('ub11active_section',id);
 document.querySelectorAll('main>section').forEach(sec=>sec.classList.toggle('active-section',sec.id===id));
 document.querySelectorAll('.navbtn').forEach(b=>{const on=b.dataset.id===id;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false');});
 updatePanelToolbar();if(mark)markDone(id);else updateProgress();
 if(scrollTop){const main=document.querySelector('main');if(main)main.scrollTo({top:0,behavior:'smooth'});}
}
function activeNav(){setActiveSection(activeSectionId,false,false);}
function detailsFor(indices, openFirst=false){return indices.filter(i=>D().parts[i]).map((i,n)=>{const p=D().parts[i];const open=(openFirst&&n===0)?' open':'';return '<details'+open+'><summary>'+p.title+'</summary>'+p.html+'</details>';}).join('');}
function moduleHeader(key){return '<div class="module-heading">'+S().moduleLabels[key]+'</div>';}
function setLead(id,key){const el=$(id); if(el) el.textContent=S().sectionLead[key]||'';}
function setStaticText(){
 document.documentElement.lang=lang; document.body.classList.toggle('ko',lang==='ko');
 $('eyebrow').textContent=U().eyebrow; $('appTitle').textContent=U().title; $('tagline').textContent=U().tagline; $('heroTitle').textContent=U().title; $('heroClaim').textContent=U().heroClaim;
 $('formationAimTitle').textContent=U().formationAimTitle; $('formationAim').textContent=U().formationAim; $('methodTitle').textContent=U().methodTitle; $('method').textContent=U().method; $('thresholdTitle').textContent=U().thresholdTitle; $('threshold').textContent=U().threshold;
 $('overviewPrimary').textContent=U().overviewPrimary; $('overviewMode').textContent=U().overviewMode; $('printBtn').textContent=U().print; $('printBtn2').textContent=U().print; $('resetBtn').textContent=U().reset; $('gradeBtn').textContent=U().gradeQuiz; $('exportBtn').textContent=U().export;
 $('glossSearch').placeholder=U().searchGlossary; $('reflectionIntro').textContent=U().reflectionIntro; $('exportHint').textContent=U().exportHint;
 $('studentLabel').textContent=U().studentName; $('sidLabel').textContent=U().studentId; $('classLabel').textContent=U().classLabel;
 $('r1Label').textContent=U().r1; $('r2Label').textContent=U().r2; $('r3Label').textContent=U().r3; $('r4Label').textContent=U().r4;
 $('courseWeekLabel').textContent=S().overviewLabels[0]; $('primaryClaimLabel').textContent=S().overviewLabels[1]; $('learningModeLabel').textContent=S().overviewLabels[2]; $('coreTextIntro').textContent=S().coreTextIntro;
 document.querySelectorAll('h2[data-key]').forEach(h=>h.textContent=S().headings[h.dataset.key]||h.dataset.key);
 setLead('overviewLead','overview');setLead('whyLead','why');setLead('literaryLead','literary');setLead('structuralLead','structural');setLead('intentLead','intent');setLead('textsLead','texts');setLead('scholarsLead','scholars');setLead('reflectionLead','reflection');
 $('footerText').textContent=lang==='ko'?'UB 11주차 사도행전 적응형 학습 · Section-Matched App':'UB Week 11 Acts Adaptive Learning · Section-Matched App';
}
function renderOverview(){$('overviewContent').innerHTML=moduleHeader('overview')+detailsFor([1],true);}
function renderWhy(){$('whyContent').innerHTML=moduleHeader('why')+detailsFor([0,2],true);}
function renderLiterary(){$('literaryBox').innerHTML=S().literary.map(x=>'<div class="step"><b>'+x[0]+'</b> '+x[1]+'</div>').join('')+'<blockquote>'+S().literaryQuote+'</blockquote>';$('literaryContent').innerHTML=moduleHeader('literary')+detailsFor([3,4]);}
function renderStructural(){$('structuralBox').innerHTML=S().structural.map(x=>'<div class="text-card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('');$('structuralContent').innerHTML=moduleHeader('structural')+detailsFor([5]);}
function renderIntent(){$('intentBox').innerHTML=S().intent.map(x=>'<div class="text-card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('');$('intentContent').innerHTML=moduleHeader('intent')+detailsFor([12]);}
function renderTexts(){$('textBox').innerHTML=D().texts.map(t=>'<div class="text-card"><h3>'+t[0]+'</h3><p>'+t[1]+'</p><p><b>Movement:</b> '+U().movementPrompt+'</p></div>').join('');$('textContent').innerHTML=moduleHeader('texts')+detailsFor([6,7,8,9,10,11]);}
function renderScholars(){$('scholarBox').innerHTML=D().scholars.map(s=>'<details><summary>'+s[0]+'</summary><p>'+s[1]+'</p></details>').join('');$('scholarContent').innerHTML=moduleHeader('scholars')+detailsFor([14]);}
function renderReflectionGuide(){$('reflectionGuide').innerHTML=moduleHeader('reflection')+detailsFor([13]);}
function renderGlossary(filter=''){const f=filter.toLowerCase();$('glossBox').innerHTML=D().glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(f)).map(g=>'<div class="text-card"><b>'+g[0]+'</b><p>'+g[1]+'</p></div>').join('');}
function renderQuiz(){$('quizBox').innerHTML=D().quiz.map((q,i)=>'<div class="q"><b>Q'+(i+1)+'. '+q.q+'</b>'+q.choices.map((c,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'">'+c+'</label>').join('')+'<div id="fb'+i+'"></div></div>').join('');$('score').textContent='';}
function gradeQuiz(){let score=0;D().quiz.forEach((q,i)=>{const picked=document.querySelector('input[name="q'+i+'"]:checked');const fb=$('fb'+i);if(picked&&Number(picked.value)===q.a){score++;fb.className='feedback ok';fb.textContent=U().correct+q.explain;}else{fb.className='feedback no';fb.textContent=U().review+q.explain;}});$('score').textContent=U().score+': '+score+' / '+D().quiz.length;markDone('quiz');}
function exportReflection(){const data={course:'UB Week 11 Acts',language:lang,student:$('student').value,id:$('sid').value,className:$('cls').value,insight:$('r1').value,tension:$('r2').value,question:$('r3').value,movement:$('r4').value,structure:'section-matched modules',exportedAt:new Date().toISOString()};$('exportOut').value=JSON.stringify(data,null,2);markDone('submit');}
function renderAll(){setStaticText();buildNav();renderOverview();renderWhy();renderLiterary();renderStructural();renderIntent();renderTexts();renderScholars();renderGlossary($('glossSearch').value||'');renderQuiz();renderReflectionGuide();setActiveSection(activeSectionId,false,false);updateProgress();}
$('lang').addEventListener('change',e=>{lang=e.target.value;renderAll();});
$('printBtn').addEventListener('click',()=>window.print());$('printBtn2').addEventListener('click',()=>window.print());$('resetBtn').addEventListener('click',resetProgress);$('gradeBtn').addEventListener('click',gradeQuiz);$('exportBtn').addEventListener('click',exportReflection);$('glossSearch').addEventListener('input',e=>renderGlossary(e.target.value));
$('panelPrev').addEventListener('click',()=>{const ids=sectionIds();const i=ids.indexOf(activeSectionId);if(i>0)setActiveSection(ids[i-1],true,true);});
$('panelNext').addEventListener('click',()=>{const ids=sectionIds();const i=ids.indexOf(activeSectionId);if(i<ids.length-1)setActiveSection(ids[i+1],true,true);});
window.addEventListener('keydown',e=>{if(e.target&&['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;const ids=sectionIds();const i=ids.indexOf(activeSectionId);if(e.key==='ArrowLeft'&&i>0)setActiveSection(ids[i-1],true,true);if(e.key==='ArrowRight'&&i<ids.length-1)setActiveSection(ids[i+1],true,true);});
renderAll();
</script>
</body></html>
